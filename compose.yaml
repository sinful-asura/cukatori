# What local development needs from Docker. The Nest API and the Angular dev server run as local
# processes (dekit.yaml). The project, container and volume names are the ones the first setup used, so existing local data is kept.
name: ascend-os

services:
  postgres:
    image: postgres:18-alpine
    container_name: ascend-os-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ascend}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ascend}
      POSTGRES_DB: ${POSTGRES_DB:-ascend}
    ports:
      # 5433 on the host: Knezevic Garage's database already uses 5432.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
