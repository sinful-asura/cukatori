# Static files only. /api is routed to the API by the cluster ingress, not by this server.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Hashed build output: cache for a year. A missing file is a 404, never the HTML shell.
    location ~* \.(?:js|mjs|css|map|woff2?|ttf|eot|svg|png|jpe?g|webp|gif|ico|webmanifest)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
