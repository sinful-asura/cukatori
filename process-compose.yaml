# `task dev` starts these in one terminal UI; `task dev -- api` starts api and what it depends on.
# .env in this directory is loaded for every process.
version: "0.5"

processes:
  db:
    # Starts Postgres detached and exits once it is healthy. Stop it with: docker compose stop db
    command: docker compose up -d --wait db

  api:
    command: npm run start:dev
    working_dir: api
    depends_on:
      db:
        condition: process_completed_successfully
    readiness_probe:
      http_get:
        host: 127.0.0.1
        port: 3000
        path: /api/health
      initial_delay_seconds: 3
      period_seconds: 2
      failure_threshold: 60

  web:
    command: npx ng serve --proxy-config proxy.conf.json
