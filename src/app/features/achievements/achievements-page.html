<section class="achievements">
  <app-page-header title="Achievements" kicker="Achieve">
    @if (!loading()) {
      <p-badge [value]="unlocked().length + ' unlocked'" />
    }
  </app-page-header>

  @if (loading()) {
    <div class="grid">
      @for (n of [1, 2, 3, 4]; track n) {
        <p-skeleton width="100%" height="5.5rem" borderRadius="16px" />
      }
    </div>
  } @else {
    <div class="grid">
      @for (item of grid(); track item.id) {
        <p-card styleClass="pos-panel" [class.locked]="!item.unlockedAt">
          <div class="card-body">
            <p class="title">{{ item.title }}</p>
            <p class="desc">{{ item.description }}</p>
            @if (item.unlockedAt) {
              <time>{{ item.unlockedAt | date: 'MMM d, y' }}</time>
            }
          </div>
        </p-card>
      }
    </div>
  }
</section>
