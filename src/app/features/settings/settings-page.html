<section class="settings">
  <app-page-header title="Settings" kicker="System" />

  <p-card styleClass="pos-panel">
    <div class="rows">
      <div class="row">
        <span>Theme</span>
        <p-togglebutton
          [ngModel]="dark"
          (ngModelChange)="setTheme($event)"
          onLabel="Dark"
          offLabel="Light"
          onIcon="pi pi-moon"
          offIcon="pi pi-sun"
        />
      </div>

      <div class="row">
        <span>Units</span>
        <p-select
          [options]="unitOptions"
          [ngModel]="store.settings().units"
          (ngModelChange)="setUnits($event)"
          optionLabel="label"
          optionValue="value"
          aria-label="Units"
        />
      </div>

      <div class="row">
        <span>Currency</span>
        <p-select
          [options]="currencyOptions"
          [ngModel]="store.settings().currency"
          (ngModelChange)="setCurrency($event)"
          optionLabel="label"
          optionValue="value"
          aria-label="Currency"
        />
      </div>

      <div class="row">
        <span>Preferred name</span>
        <input
          pInputText
          [ngModel]="store.settings().displayName"
          (ngModelChange)="setDisplayName($event)"
          aria-label="Preferred name"
        />
      </div>
    </div>

    <div class="actions">
      <p-button label="Reset defaults" [outlined]="true" (onClick)="store.reset()" />
    </div>
  </p-card>
</section>
