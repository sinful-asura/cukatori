<section class="settings">
  <header>
    <h1>Settings</h1>
    <p>Theme, units, and currency for this device.</p>
  </header>

  <p-card>
    <div class="row">
      <div>
        <h2>Appearance</h2>
        <p>Dark matches the Ascend OS canvas. Light is available if you need it.</p>
      </div>
      <p-togglebutton
        [ngModel]="dark"
        (ngModelChange)="setTheme($event)"
        onLabel="Dark"
        offLabel="Light"
        onIcon="pi pi-moon"
        offIcon="pi pi-sun"
      />
    </div>

    <div class="row">
      <div>
        <h2>Preferred name</h2>
        <p>Used on the home greeting when you are not signed in.</p>
      </div>
      <input
        pInputText
        [ngModel]="store.settings().displayName"
        (ngModelChange)="setDisplayName($event)"
        aria-label="Preferred name"
      />
    </div>

    <div class="row">
      <div>
        <h2>Units</h2>
        <p>Default mass unit for exercise logging.</p>
      </div>
      <p-select
        [options]="unitOptions"
        [ngModel]="store.settings().units"
        (ngModelChange)="setUnits($event)"
        optionLabel="label"
        optionValue="value"
      />
    </div>

    <div class="row">
      <div>
        <h2>Currency</h2>
        <p>Default currency for finance.</p>
      </div>
      <p-select
        [options]="currencyOptions"
        [ngModel]="store.settings().currency"
        (ngModelChange)="setCurrency($event)"
        optionLabel="label"
        optionValue="value"
      />
    </div>

    <div class="actions">
      <p-button label="Reset defaults" [outlined]="true" (onClick)="store.reset()" />
    </div>
  </p-card>
</section>
