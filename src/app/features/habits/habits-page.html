<section class="habits">
  <p-tabs [value]="tab()" (valueChange)="onTab($event)">
    <p-tablist>
      <p-tab value="today">Today</p-tab>
      <p-tab value="all">All</p-tab>
    </p-tablist>
    <p-tabpanels>
      <p-tabpanel value="today">
        <p-card styleClass="panel">
          <ng-template #title>
            <div class="panel-head">
              <span>Today</span>
              <div class="panel-actions">
                <p-button label="View all" [text]="true" size="small" (onClick)="showAll()" />
                <p-button icon="pi pi-plus" [rounded]="true" [text]="true" size="small" aria-label="Add habit" (onClick)="openCreate()" />
              </div>
            </div>
          </ng-template>
          <ng-container [ngTemplateOutlet]="list" />
        </p-card>
      </p-tabpanel>
      <p-tabpanel value="all">
        <p-card styleClass="panel">
          <ng-template #title>
            <div class="panel-head">
              <span>Habits</span>
              <p-button label="Add habit" icon="pi pi-plus" [text]="true" size="small" (onClick)="openCreate()" />
            </div>
          </ng-template>
          <ng-container [ngTemplateOutlet]="list" />
        </p-card>
      </p-tabpanel>
    </p-tabpanels>
  </p-tabs>
</section>

<ng-template #list>
  <ul class="checklist">
    @for (habit of visibleHabits(); track habit.id) {
      <li>
        <p-checkbox
          [inputId]="'habit-' + habit.id"
          [binary]="true"
          [ngModel]="habit.completedToday"
          [readonly]="habit.completedToday"
          (onChange)="onCheck(habit, $event)"
        />
        <label [attr.for]="'habit-' + habit.id" [class.done]="habit.completedToday">{{ habit.title }}</label>
        @if (habit.xpHint > 0) {
          <p-tag [value]="xpLabel(habit.xpHint)" severity="secondary" />
        }
      </li>
    }
  </ul>
</ng-template>

<p-dialog
  header="New habit"
  [modal]="true"
  [visible]="createOpen()"
  (visibleChange)="createOpen.set($event)"
  [style]="{ width: 'min(420px, 92vw)' }"
>
  <div class="form">
    <label for="habit-title">Title</label>
    <input id="habit-title" pInputText [(ngModel)]="draft.title" placeholder="Read 20 pages" />
    <label for="habit-schedule">Schedule</label>
    <p-select
      inputId="habit-schedule"
      [options]="scheduleOptions"
      optionLabel="label"
      optionValue="value"
      [(ngModel)]="draft.schedule"
    />
    <label for="habit-xp">XP hint</label>
    <p-inputnumber inputId="habit-xp" [(ngModel)]="draft.xpHint" [min]="0" [showButtons]="false" />
  </div>
  <ng-template #footer>
    <p-button label="Cancel" [text]="true" (onClick)="createOpen.set(false)" />
    <p-button label="Save" [loading]="saving()" (onClick)="create()" />
  </ng-template>
</p-dialog>
