<div class="shell">
  <aside class="rail">
    <div class="rail-inner">
      <a routerLink="/os" class="workspace">
        <span class="avatar">K</span>
        <span>Kristijan’s workspace</span>
      </a>

      <nav>
        <div class="group primary">
          @for (link of primary; track link.path) {
            <a
              [routerLink]="link.path"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: link.exact === true }"
            >
              <i [class]="link.icon"></i>
              {{ link.label }}
            </a>
          }
        </div>
        <div class="group">
          @for (link of secondary; track link.path) {
            <a
              [routerLink]="link.path"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: link.exact === true }"
            >
              <i [class]="link.icon"></i>
              {{ link.label }}
            </a>
          }
        </div>
      </nav>
    </div>

    <div class="user">
      <span class="avatar sm">K</span>
      <span class="name">Kristijan</span>
      <p-button
        icon="pi pi-search"
        [rounded]="true"
        [text]="true"
        aria-label="Quick log"
        (onClick)="openQuickLog()"
      />
    </div>
  </aside>

  <main class="main">
    <div class="canvas">
      <router-outlet />
    </div>
  </main>
</div>
