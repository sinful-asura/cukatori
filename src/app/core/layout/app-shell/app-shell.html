<div class="shell">
  <aside class="rail">
    <a routerLink="/os" class="brand">
      <span class="mark"></span>
      Ascend OS
    </a>
    <nav>
      @for (link of links; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
        >{{ link.label }}</a>
      }
    </nav>
    <div class="user">
      <span class="avatar">K</span>
      <div>
        <strong>Kristijan</strong>
        <small>Level 18</small>
      </div>
    </div>
  </aside>
  <div class="main">
    <header>
      <label class="search">
        <input
          type="search"
          placeholder="Search or type a command…"
          (focus)="openQuickLog()"
          (click)="openQuickLog()"
        />
      </label>
      <time>Thu, Sep 11 2026</time>
    </header>
    <section class="page">
      <router-outlet />
    </section>
  </div>
</div>
