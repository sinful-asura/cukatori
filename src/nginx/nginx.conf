# Host nginx (garage layout): TLS on the host, proxy to local Docker publish ports.
# Upgrade only when the client asked for a WebSocket; keep REST as normal HTTP.
map $http_upgrade $cukatori_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name cukatori.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cukatori.local;

    # Replace with Let's Encrypt paths on the real host.
    # ssl_certificate /etc/letsencrypt/live/cukatori.local/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/cukatori.local/privkey.pem;

    error_log /var/log/nginx/cukatori_error.log;
    access_log /var/log/nginx/cukatori_access.log;

    location /api/ {
        client_max_body_size 12m;
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $cukatori_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
