# Postgres 18 — shared service (no host ports).
# Local: npm run local -- db  (adds docker-compose.db.local.yaml for :5432)
# Prod: included by docker-compose.prod.yaml (Postgres stays on the Docker network only).

name: cukatori

services:
  postgres:
    image: postgres:18-alpine
    container_name: cukatori-postgres
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cukatori}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cukatori}
      POSTGRES_DB: ${POSTGRES_DB:-cukatori}
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      default:
        aliases:
          - postgres
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
